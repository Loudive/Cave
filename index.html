<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B0B10" />
    <meta name="description" content="Cave Devourer — 2D-платформер-роуглайк про монстра в сети тёмных пещер. Ты не герой — ты хищник." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0B10'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2358E6C8'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2358E6C8' stroke-opacity='.35' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Cave Devourer — Пожиратель пещер</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0b10;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app canvas {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Диагностический ватчдог: независимый от Phaser счётчик RAF + ловля ошибок.
      window.__ERRS__ = [];
      window.addEventListener('error', function (e) {
        window.__ERRS__.push('error: ' + e.message + ' @ ' + (e.filename || '') + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__ERRS__.push('rejection: ' + String(e.reason));
      });
      window.__RAF__ = { n: 0 };
      (function rafWatch() {
        window.__RAF__.n++;
        requestAnimationFrame(rafWatch);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
